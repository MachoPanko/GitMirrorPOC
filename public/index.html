<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Live README Viewer</title>
  <!-- Import the Marked.js library for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292e; background-color: #f6f8fa; margin: 0; padding: 20px; }
    #container { max-width: 800px; margin: 0 auto; }
    #readme-card { background-color: white; padding: 20px 40px; border-radius: 10px; border: 1px solid #e1e4e8; }
    /* Basic styles for rendered markdown */
    #readme-content h1, #readme-content h2 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
    #readme-content code { background-color: rgba(27,31,35,0.05); padding: 0.2em 0.4em; margin: 0; font-size: 85%; border-radius: 3px; }
    #readme-content pre { background-color: #f6f8fa; padding: 16px; overflow: auto; border-radius: 3px; }
    #readme-content blockquote { border-left: 0.25em solid #dfe2e5; padding: 0 1em; color: #6a737d; }
  </style>
</head>
<body>

  <div id="container">
    <h1>Live README Viewer</h1>
    <p>The content of the <code>README.md</code> from your repository's main branch will appear below. It will update automatically after a push.</p>
    <div id="readme-card">
      <div id="readme-content">
        <p>Fetching README...</p>
      </div>
    </div>
  </div>

  <script>
    const readmeElement = document.getElementById('readme-content');

    // This function fetches the README content from our backend
    async function fetchReadme() {
      try {
        const response = await fetch('/api/readme'); // Calls our NEW backend endpoint
        const data = await response.json();

        // Use the marked library to parse Markdown into HTML
        const renderedHtml = marked.parse(data.content);

        // Update the page with the rendered HTML
        readmeElement.innerHTML = renderedHtml;

      } catch (error) {
        console.error('Failed to fetch README:', error);
        readmeElement.innerHTML = '<h2>Error connecting to backend.</h2>';
      }
    }

    // Call the function once immediately when the page loads
    fetchReadme();

    // And then, call it again every 5 seconds to check for updates
    setInterval(fetchReadme, 5000);
  </script>

</body>
</html>
